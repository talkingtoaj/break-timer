# On push of a tag v*, build the Windows exe and create a GitHub release.
# From WSL: run ./release.sh 1.0.3 to tag and push; this workflow does the rest.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write   # required for creating releases and uploading assets
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: python -m PyInstaller --noconfirm break_timer.spec

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: "Break reminder ${{ github.ref_name }}. Download **install_break_reminder.bat** and run it to install."
          files: |
            dist/Break.reminder.exe
            install_break_reminder.bat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
